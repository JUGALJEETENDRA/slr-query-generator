  <style>
    :root { font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; color:#20242d; background:#fff; }
    * { box-sizing:border-box; } body { min-height:100vh; margin:0; background:linear-gradient(180deg,#f9fbfc 0,#fff 220px); }
    .topbar { min-height:70px; padding:13px max(22px,calc((100vw - 1200px)/2)); display:flex; align-items:center; justify-content:space-between; gap:20px; border-bottom:1px solid #e5eaee; background:rgba(255,255,255,.92); }
    .brand { display:flex; align-items:center; gap:11px; color:#182b39; text-decoration:none; font-weight:800; letter-spacing:-.025em; }.mark { width:37px; height:37px; display:grid; place-items:center; border-radius:11px; color:#fff; background:linear-gradient(145deg,#102b39,#236878); font-weight:900; }.back { padding:9px 13px; border:1px solid #c9d8dc; border-radius:8px; color:#265c66; background:#fff; font-size:13px; font-weight:750; text-decoration:none; }
    main { max-width:1180px; margin:0 auto; padding:53px 24px 72px; text-align:center; }.eyebrow { margin:0; color:#7054a7; font-size:11px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; }.title { margin:9px 0 44px; color:#20242d; font-size:clamp(31px,4.6vw,56px); font-weight:400; letter-spacing:.075em; line-height:1; text-transform:uppercase; }
    .students { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); justify-items:center; gap:42px; }.person { width:100%; max-width:245px; display:flex; flex-direction:column; align-items:center; }.photo { width:184px; height:184px; display:grid; place-items:center; overflow:hidden; border:5px solid #f2eff9; border-radius:50%; color:#fff; background:linear-gradient(140deg,#67508f,#252c62); box-shadow:0 12px 24px rgba(47,27,97,.15); font-size:26px; font-weight:800; letter-spacing:.04em; }.photo img { width:100%; height:100%; object-fit:cover; }.name { margin:16px 0 9px; color:#101925; font-size:21px; font-weight:550; letter-spacing:-.035em; }.role { margin:0 0 13px; color:#756e82; font-size:11px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; }
    .socials { display:flex; justify-content:center; gap:11px; }.social { width:37px; height:37px; display:grid; place-items:center; border:2px solid #35137b; border-radius:50%; color:#35137b; background:#fff; text-decoration:none; transition:transform .17s ease,background .17s ease,color .17s ease; }.social:hover,.social:focus-visible { transform:translateY(-3px); color:#fff; background:#35137b; outline:none; }.social svg { width:20px; height:20px; fill:currentColor; }.social .mail { fill:none; stroke:currentColor; stroke-width:2; }
    .mentor-area { display:flex; justify-content:center; margin-top:58px; padding-top:40px; border-top:1px solid #e8e7ec; }.mentor-area .person { max-width:270px; }.mentor-label { margin:0 0 18px; color:#7054a7; font-size:12px; font-weight:900; letter-spacing:.14em; text-transform:uppercase; }.mentor .photo { background:linear-gradient(140deg,#178e97,#1a405d); }.note { margin:10px 0 0; color:#879099; font-size:11px; }
    @media (max-width:700px) { main { padding:38px 18px 52px; }.title { margin-bottom:35px; letter-spacing:.045em; }.students { grid-template-columns:1fr; gap:36px; }.mentor-area { margin-top:42px; }.photo { width:166px; height:166px; } }
  </style>
